name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# K-17: least-privilege token. This workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: PyTest & Conformance (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13' ]

    steps:
      - name: Checkout Repository
        # K-17: third-party actions are pinned to full commit SHAs, not mutable
        # tags, so a tag retag/hijack cannot inject code into this safety CI.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Static Analysis
        run: |
          ruff check .

      - name: Run PyTest Conformance & Safety Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v --durations=10
